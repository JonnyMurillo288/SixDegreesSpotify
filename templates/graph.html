<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SixDegreeSpotify</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 2rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    .actions { display: flex; gap: .5rem; }
    .btn {
      display: inline-block;
      padding: .5rem .75rem;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      background: #000;
      color: #fff;
    }
    form { margin-top: 1.25rem; max-width: 720px; }
    label { display: block; margin-top: .75rem; }
    input[type=text], input[type=number] {
      width: 100%;
      padding: .6rem .7rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .muted { color: #666; }
    #results { margin-top: 1.25rem; }
    .error { color: #b00020; }
    .spinner { display: none; margin-left: 0.75rem; }

    /* GRAPH */
    #graph {
      margin-top: 2rem;
      border: 1px solid #444;
      height: 500px;
    }
    #edge-tooltip {
      position: absolute;
      background: #000;
      border: 1px solid #444;
      padding: 6px;
      border-radius: 6px;
      display: none;
      pointer-events: none;
      z-index: 9999;
    }
    #edge-tooltip img {
      width: 120px;
      height: 120px;
      border-radius: 5px;
      object-fit: cover;
    }
    #edge-tooltip .title {
      color: #fff;
      font-size: 12px;
      margin-top: 4px;
      text-align: center;
    }
  </style>

  <!-- Graphology + Sigma v2 (ONLY) -->
  <script src="https://unpkg.com/graphology@0.25.4/dist/graphology.umd.min.js"></script>
  <script src="https://unpkg.com/sigma@2.3.0/build/sigma.min.js"></script>
</head>
<body>
  <header>
    <h1>SixDegreeSpotify</h1>
    <div class="actions">
      <a class="btn" href="/auth">Login with Spotify</a>
      <a class="btn" href="/status" target="_blank">Status</a>
    </div>
  </header>

  <p class="muted">Find a collaboration path between two artists using Spotify data.</p>

  <form id="searchForm">
    <div class="row">
      <label>
        Start Artist
        <input id="startArtist" type="text" name="start" placeholder="Eminem" required />
      </label>
      <label>
        Target Artist
        <input id="targetArtist" type="text" name="target" placeholder="Taylor Swift" required />
      </label>
    </div>
    <div class="row">
      <label>
        Max Depth (optional)
        <input id="depth" type="number" name="depth" min="-1" step="1" value="-1" />
      </label>
    </div>
    <button class="btn" type="submit">Search</button>
    <span id="spinner" class="spinner">Searching…</span>
    <div class="muted">Can take up to 30 minutes to process.</div>
  </form>

  <div id="results"></div>

  <!-- GRAPH container -->
  <div id="graph"></div>

  <script>
    // -------------------------------
    // GLOBALS
    // -------------------------------
    let graph = new graphology.Graph();
    let renderer = null;

    const ARTIST_COLOR = "#2ecc71";
    const START_COLOR  = "#2779bd";
    const TARGET_COLOR = "#c53030";
    const EDGE_COLOR   = "#e74c3c";

    // -------------------------------
    // Helpers: layout artists along a line
    // -------------------------------
    function computeArtistPositions(path) {
      const pos = new Map();
      if (!path || path.length === 0) return pos;

      let index = 0;

      const first = path[0];
      if (!pos.has(first.from)) pos.set(first.from, index++);
      if (!pos.has(first.to))   pos.set(first.to,   index++);

      for (let i = 1; i < path.length; i++) {
        const s = path[i];
        if (!pos.has(s.to)) pos.set(s.to, index++);
        if (!pos.has(s.from)) pos.set(s.from, index++);
      }

      return pos;
    }

    function ensureArtistNode(name, start, target, posMap) {
      if (graph.hasNode(name)) return;

      let color = ARTIST_COLOR;
      let size = 8;

      if (name === start) { color = START_COLOR; size = 12; }
      else if (name === target) { color = TARGET_COLOR; size = 12; }

      let x = Math.random();
      let y = Math.random();

      if (posMap && posMap.has(name)) {
        const i = posMap.get(name);
        x = i * 2;
        y = 0.5 * Math.sin(i);
      }

      graph.addNode(name, {
        label: name,
        size,
        color,
        x,
        y,
      });
    }

    function addStep(step, start, target, posMap) {
      const from  = step.from;
      const to    = step.to;
      const track = step.track;

      ensureArtistNode(from, start, target, posMap);
      ensureArtistNode(to,   start, target, posMap);

      const edgeId = `${from}->${to}-${track}`;
      if (!graph.hasEdge(edgeId)) {
        graph.addEdgeWithKey(edgeId, from, to, {
          label: track,
          size: 2,
          color: EDGE_COLOR,
          trackURL: step.trackURL || ""   // <-- FIXED HERE
        });
      }
    }

    function drawPath(path, start, target) {
      graph = new graphology.Graph();

      const container = document.getElementById("graph");
      container.innerHTML = "";

      const posMap = computeArtistPositions(path);

      path.forEach(step => addStep(step, start, target, posMap));

      renderer = new Sigma(graph, container, {
        renderLabels: true,
        renderEdgeLabels: true,
        labelDensity: 0.7,
        labelColor: { color: "#ffffff" },
      });

      const tooltip = document.getElementById("edge-tooltip");

      renderer.on("enterEdge", ({ edge }) => {
        const attr = graph.getEdgeAttributes(edge);
        const trackName = attr.label || "";
        const trackURL = attr.trackURL || "";

        if (!trackURL) return;

        tooltip.innerHTML = `
          <img src="${trackURL}">
          <div class="title">${trackName}</div>
        `;
        tooltip.style.display = "block";
      });

      renderer.on("leaveEdge", () => {
        tooltip.style.display = "none";
      });

      renderer.on("mousemove", (e) => {
        tooltip.style.left = e.event.x + 15 + "px";
        tooltip.style.top = e.event.y + 15 + "px";
      });
    }

    // -------------------------------
    // Search
    // -------------------------------
    async function runSearch() {
      const start = document.getElementById("startArtist").value.trim();
      const target = document.getElementById("targetArtist").value.trim();
      const depth = Number(document.getElementById("depth").value || -1);

      const resultsDiv = document.getElementById("results");
      const spinner = document.getElementById("spinner");

      if (!start || !target) {
        resultsDiv.innerHTML = '<p class="error">Start and Target are required.</p>';
        return;
      }

      resultsDiv.innerHTML = "";
      spinner.style.display = "inline";

      try {
        const res = await fetch("/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start, target, depth }),
        });

        spinner.style.display = "none";

        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || res.statusText);
        }

        const data = await res.json();

        if (data.message) {
          resultsDiv.innerHTML = `<p class="muted">${data.message}</p>`;
          return;
        }

        resultsDiv.innerHTML = `
          <p><strong>Start:</strong> ${data.start}<br>
             <strong>Target:</strong> ${data.target}<br>
             <strong>Hops:</strong> ${data.hops}</p>`;

        drawPath(data.path, data.start, data.target);

      } catch (err) {
        spinner.style.display = "none";
        resultsDiv.innerHTML = `<p class="error">Request failed: ${err}</p>`;
      }
    }

    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      runSearch();
    });
  </script>

  <div id="edge-tooltip"></div>
</body>
</html>
